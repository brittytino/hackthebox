services:
  postgres:
    image: postgres:16-alpine
    container_name: theextraction_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only — this is a DB port with no business being
      # reachable from the LAN/internet. Use an SSH tunnel for remote admin.
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - theextraction_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: theextraction_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - theextraction_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: theextraction_backend
    environment:
      # bcrypt (used on every login/register/flag-submit) runs on Node's libuv
      # threadpool, default size 4 — under concurrent load from many
      # participants at once that becomes a bottleneck. Raise it.
      UV_THREADPOOL_SIZE: '16'
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      EVENT_DATE: ${EVENT_DATE}
      EVENT_NAME: ${EVENT_NAME}
    ports:
      - "0.0.0.0:${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - theextraction_network
    # No bind mounts in production
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        API_INTERNAL_URL: ${API_INTERNAL_URL}
    container_name: theextraction_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      PORT: 3000
    ports:
      - "0.0.0.0:${NEXTJS_PORT}:3000"
    depends_on:
      - backend
    networks:
      - theextraction_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: theextraction_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      # Bound to localhost only — do not expose the DB admin GUI to the LAN.
      - "127.0.0.1:${PGADMIN_HOST_PORT}:80"
    networks:
      - theextraction_network
    restart: unless-stopped

networks:
  theextraction_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
